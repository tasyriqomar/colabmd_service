version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: colabmd_redis
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: colabmd_api
    # FIX: Changed "backend.main:app" to "main:app"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - ./shared_data:/app/shared_data
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

  worker:
    build: .
    container_name: colabmd_worker
    command: ["celery", "-A", "tasks.worker.celery_app", "worker", "--loglevel=info"]
    depends_on:
      - redis
    volumes:
      - ./shared_data:/app/shared_data
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

  # NEW: The Streamlit Frontend
  frontend:
    build: .
    container_name: colabmd_frontend
    command: ["streamlit", "run", "frontend/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    depends_on:
      - api